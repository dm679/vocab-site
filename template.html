<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1c1930">
<title>{{NAME}} — My Vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1930;--card:#262239;--card-line:#332e4a;--ink:#f4f1ff;--soft:#c9c2ea;--muted:#8d85ad;
  --coral:#ff5a5f;--coral-dark:#d6404a;--yellow:#ffc53d;--blue:#3d7bf5;--blue-dark:#2a5cc4;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Nunito",system-ui,-apple-system,sans-serif;font-size:18px;line-height:1.35;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding:28px 16px 40px}
h1{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:clamp(30px,8vw,40px);line-height:1.1;margin:0;color:var(--soft)}
h1 .name{color:var(--coral)}
h1 .dot{color:var(--yellow)}
.sub{color:var(--muted);font-weight:700;font-size:16px;margin:6px 0 22px}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px}
.search label{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--card-line);border-radius:14px;padding:0 16px}
.search label:focus-within{border-color:var(--blue)}
.search svg{flex-shrink:0;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:700 18px "Nunito",sans-serif;padding:13px 0;outline:none}
.search input::placeholder{color:var(--muted)}
.count{color:var(--muted);font-weight:700;font-size:15px;margin:14px 0 10px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--card-line);border-radius:16px;padding:12px;margin:0 0 10px}
.num{width:32px;height:32px;border-radius:9px;background:var(--yellow);color:#3a2a00;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:flex-start;margin-top:2px}
.main{flex:1;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.word{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:22px;line-height:1.2;color:#fff}
.ipa{color:var(--soft);font-size:15px;opacity:.85}
.tr{font-weight:800;font-size:17px;color:#e8e4fb;margin-top:3px}
.pos{display:inline-block;font-weight:900;font-size:12px;line-height:1;color:#fff;padding:4px 8px;border-radius:999px}
.speak{border:0;width:44px;height:44px;border-radius:12px;background:var(--blue);box-shadow:0 4px 0 var(--blue-dark);color:#fff;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dark)}
.empty{text-align:center;color:var(--muted);padding:26px 0;font-weight:700}
hr{border:0;border-top:2px dashed var(--card-line);margin:18px 0 16px}
.types{color:var(--muted);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.pos-n{background:#3d7bf5}.pos-v{background:#e8406f}.pos-adj{background:#ff8a1f}.pos-adv{background:#8b5cf6}
.pos-prep{background:#14b8a6}.pos-pron{background:#ec5fa8}.pos-conj{background:#8a5a3b}.pos-num{background:#7d8190}
.pos-phr{background:#f5c400;color:#3a2d00}.pos-i{background:#f97316}
.overlay{position:fixed;inset:0;background:rgba(14,12,26,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--card);border-radius:22px;padding:24px 20px 20px;text-align:center;width:100%;max-width:300px;box-shadow:0 20px 50px rgba(0,0,0,.45);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.wave{font-size:48px;display:inline-block;animation:wave 1.4s ease-in-out infinite;transform-origin:70% 80%}
.modal h2{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:28px;margin:6px 0 4px;color:#fff}
.modal p{color:var(--soft);font-weight:700;font-size:17px;margin:0 0 16px}
.go{width:100%;font:800 20px "Baloo 2","Nunito",sans-serif;color:#fff;background:var(--coral);border:0;border-radius:14px;padding:10px 0 8px;cursor:pointer;box-shadow:0 5px 0 var(--coral-dark)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--coral-dark)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-8deg)}45%{transform:rotate(12deg)}}
</style>
</head>
<body data-name="{{NAME}}">
<div class="overlay" id="hello"><div class="modal"><div class="wave">👋</div><h2>Hi, {{NAME}}!</h2><p>Ready to learn new words?</p><button class="go">Let's go!</button></div></div>
<div class="wrap">
<h1><span class="name">{{NAME}}</span> — My Vocabulary<span class="dot">.</span></h1>
<div class="sub">Tap 🔊 to hear a word</div>
<div class="search"><label><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Search... / Пошук..." autocomplete="off"></label></div>
<div class="count" id="count"></div>
<ul id="list"></ul>
<hr>
<div class="types">Word types</div>
<div class="legend" id="legend"></div>
</div>
<script>
window.WORDS = {{WORDS}};
(function(){
  var NAME = document.body.getAttribute('data-name') || '';
  var POS = {n:'noun',v:'verb',adj:'adjective',adv:'adverb',prep:'preposition',pron:'pronoun',conj:'conjunction',num:'numeral',phr:'phrase',i:'idiom'};
  var words = [];

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  function speak(t){
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t);
    u.lang = 'en-US'; u.rate = 0.85;
    var v = speechSynthesis.getVoices().filter(function(x){return /^en[-_]US/i.test(x.lang);})[0]
         || speechSynthesis.getVoices().filter(function(x){return /^en/i.test(x.lang);})[0];
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }

  function render(q){
    q = (q||'').trim().toLowerCase();
    var list = document.getElementById('list');
    var html = '';
    words.forEach(function(w, i){
      if(q && w.word.toLowerCase().indexOf(q) < 0 && String(w.tr).toLowerCase().indexOf(q) < 0) return;
      html += '<li><div class="num">'+(i+1)+'</div><div class="main"><div class="top">'
        + '<span class="word">'+esc(w.word)+'</span>'
        + '<span class="pos pos-'+esc(w.pos)+'" title="'+esc(POS[w.pos]||'')+'">'+esc(w.pos)+'</span>'
        + '<span class="ipa">'+esc(w.ipa)+'</span></div>'
        + '<div class="tr">'+esc(w.tr)+'</div></div>'
        + '<button class="speak" aria-label="Say '+esc(w.word)+'" data-i="'+i+'"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></li>';
    });
    list.innerHTML = html || '<div class="empty">'+(words.length?'No words found 🙈':'No words yet — see you at the lesson! ✨')+'</div>';
    document.getElementById('count').textContent = words.length + (words.length===1?' word':' words');
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest('.speak');
    if(b) speak(words[+b.getAttribute('data-i')].word);
    if(e.target.closest('.go')) document.getElementById('hello').remove();
  });

  document.getElementById('q').addEventListener('input', function(e){ render(e.target.value); });

  var leg = '';
  Object.keys(POS).forEach(function(k){ leg += '<span><b class="pos pos-'+k+'">'+k+'</b> '+POS[k]+'</span>'; });
  document.getElementById('legend').innerHTML = leg;

  if('speechSynthesis' in window) speechSynthesis.getVoices();

  words = window.WORDS || []; render('');
})();
</script>
</body></html>
