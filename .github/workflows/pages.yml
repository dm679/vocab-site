name: Publish vocabularies
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore recorded audio
        uses: actions/cache@v4
        with:
          path: audio
          key: audio-ryan2-${{ hashFiles('*/words.json') }}
          restore-keys: audio-ryan2-
      - name: Record male US voice for new words
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q "piper-tts>=1.2"
          mkdir -p voice
          curl -sSL -o voice/v.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high/en_US-ryan-high.onnx
          curl -sSL -o voice/v.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high/en_US-ryan-high.onnx.json
          python3 tts.py voice/v.onnx
      - run: python3 build.py && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
