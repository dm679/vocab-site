name: Publish vocabularies
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # One-time seed: older recordings lived only in the Actions cache.
      - name: Restore older recordings
        uses: actions/cache/restore@v4
        with:
          path: audio
          key: audio-kokoro-seed
          restore-keys: audio-kokoro-
      - name: Count words without audio
        id: need
        run: echo "count=$(python3 tts.py --count)" >> "$GITHUB_OUTPUT"
      - name: Restore voice engine
        if: steps.need.outputs.count != '0'
        id: venv
        uses: actions/cache@v4
        with:
          path: |
            ~/tts-venv
            ~/.cache/huggingface
          key: tts-venv-kokoro-v3
      - name: Record male US voice for new words
        if: steps.need.outputs.count != '0'
        run: |
          sudo apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng >/dev/null
          if ! ~/tts-venv/bin/python -c "import numpy, soundfile, kokoro" 2>/dev/null; then
            rm -rf ~/tts-venv
            python3 -m venv ~/tts-venv
            ~/tts-venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            ~/tts-venv/bin/pip install -q "kokoro>=0.9.4" soundfile
          fi
          ~/tts-venv/bin/python tts.py
      - name: Save recordings to the repository
        if: steps.need.outputs.count != '0'
        run: |
          git config user.name "vocab-bot"
          git config user.email "vocab-bot@users.noreply.github.com"
          git add audio
          git commit -q -m "Add pronunciation audio [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - run: python3 build.py && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
