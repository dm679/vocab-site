name: Publish vocabularies
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore recorded audio
        uses: actions/cache@v4
        with:
          path: audio
          key: audio-kokoro-${{ hashFiles('*/words.json') }}
          restore-keys: audio-kokoro-
      - name: Record male US voice for new words
        run: |
          sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile
          python3 tts.py
      - run: python3 build.py && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
